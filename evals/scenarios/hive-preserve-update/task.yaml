schema_version: 1
id: hive-preserve-update
revision: 1
capability_tags:
  - configuration-iac
  - hive
  - preservation
  - idempotency
prompt: prompt.md
public_files: []
fixture:
  kind: hive_lookup
  parameters:
    target_records: 1
    distractor_records: 1
    randomize_names: true
allowed_scope:
  resource_kinds: [lookup]
  mutation: update_named_target_only
required_adapter_capabilities: [shell, files, controlled_cli]
budgets:
  timeout_seconds: 600
  convergence_seconds: 120
  probe_seconds: 60
assertions:
  - hive.target.data_exact
  - hive.target.user_metadata_exact
  - hive.distractors.unchanged
  - hive.record_set.unchanged
  - hive.deliverable.identifies_target
required_deliverable_paths: []
