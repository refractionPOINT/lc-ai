[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "lc-eval"
version = "0.1.0"
description = "Harness-independent operational evaluations of the LimaCharlie CLI"
requires-python = ">=3.11"
dependencies = ["click>=8.1,<9", "pydantic>=2.10,<3", "PyYAML>=6,<7", "httpx>=0.28,<1", "aiohttp>=3.11,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.11,<1"]

[project.scripts]
lc-eval = "lc_eval.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lc_eval"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
asyncio_mode = "auto"
markers = ["live: creates authorized disposable LimaCharlie resources", "docker: needs a running Docker daemon"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
